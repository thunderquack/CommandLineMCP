services:
  server:
    build:
      context: ./mcp-server
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Database: Data Source=/data/commandline-mcp.db
    volumes:
      - ./data:/data
      - type: bind
        source: ./secrets/server.secrets.json
        target: /run/secrets/server.secrets.json
        read_only: true
        bind:
          create_host_path: false
    restart: unless-stopped
